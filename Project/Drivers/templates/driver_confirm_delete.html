<!DOCTYPE html>
<html>
<head>
    <title>Delete Driver</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/confirm.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="confirm-box">
    <h1>Delete Driver</h1>

    <p class="confirm-message">
        ⚠️ Are you sure you want to delete this driver?
    </p>

    <div class="item-info">
        <p><strong>Name:</strong> {{ driver.driver_first_name }} {{ driver.driver_last_name }}</p>
        <p><strong>License:</strong> {{ driver.driver_license_number }}</p>
        <p><strong>Phone:</strong> {{ driver.driver_phone_number }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="confirm-actions">
            <button type="submit" class="confirm-delete">Yes, Delete</button>
            <a href="{% url 'driver_list' %}" class="confirm-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
