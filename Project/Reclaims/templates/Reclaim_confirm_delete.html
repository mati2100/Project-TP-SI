<!DOCTYPE html>
<html>
<head>
    <title>Delete Reclamation</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/confirm.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="confirm-box">
    <h1>Delete Reclamation</h1>

    <p class="confirm-message">
        Are you sure you want to delete reclamation:
        <strong>{{ reclaims.reclamation_number }} - {{ reclaims.client.client_familyname }} {{ reclaims.client.client_firstname }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="confirm-actions">
            <button type="submit" class="confirm-delete">Yes, Delete</button>
            <a href="{% url 'reclaim_list' %}" class="confirm-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
