<!DOCTYPE html>
<html>
<head>
    <title>Connexion Agent</title>
</head>
<body>
    <h2>Connexion Agent</h2>
    
    {% if form.non_field_errors %}
        <div style="color: red;">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    
    {% if success_message %}
        <p style="color: green;">{{ success_message }}</p>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div>
            <label>Nom d'agent:</label>
            {{ form.agent_name }}
        </div>
        
        <div>
            <label>Mot de passe:</label>
            {{ form.agent_pwd }}
        </div>
        
        <button type="submit">Se connecter</button>
    </form>
    
    <p>Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a></p>
</body>
</html>
