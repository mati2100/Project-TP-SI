<!DOCTYPE html>
<html>
<head>
    <title>Inscription Agent</title>
</head>
<body>
    <h2>Créer un compte Agent</h2>
    
    {% if form.non_field_errors %}
        <div style="color: red;">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div>
            <label>Nom d'agent:</label>
            {{ form.agent_name }}
        </div>
        
        <div>
            <label>Email:</label>
            {{ form.agent_email }}
        </div>
    
        <div>
            <label>Mot de passe:</label>
            {{ form.agent_pwd }}
        </div>
        
        <div>
            <label>Confirmer le mot de passe:</label>
            {{ form.confirm_agent_pwd }}
        </div>
        
        <button type="submit">S'inscrire</button>
    </form>
    
    <p>Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</body>
</html>
