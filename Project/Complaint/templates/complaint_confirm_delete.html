<!DOCTYPE html>
<html>
<head>
    <title>Delete Complaint</title>
</head>
<body>
    <h1>Delete Complaint</h1>
    
    <p>Are you sure you want to delete complaint: <strong> {{ complaint.complaint_number }} - {{ complaint.client.client_familyname }} {{ client.client_firstname }}</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'client_list' %}">Cancel</a>
    </form>
</body>
</html>
