<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
        <div>
            <label>{{ field.label_tag }}</label>
            {{ field }}
            {% if field.errors %}
                <div style="color: red;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        
        <button type="submit">Save</button>
        <a href="{% url 'tour_list' %}">Cancel</a>
    </form>
</body>
</html>
