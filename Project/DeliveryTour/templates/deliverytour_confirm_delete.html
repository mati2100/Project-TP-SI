<!DOCTYPE html>
<html>
<head>
    <title>Delete Delivery Tour</title>
</head>
<body>
    <h1>Delete Delivery Tour</h1>
    
    <p>Are you sure you want to delete delivery tour: <strong>Tour #{{ tour.tour_number }} - {{ tour.driver.driver_name }}</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'tour_list' %}">Cancel</a>
    </form>
</body>
</html>
