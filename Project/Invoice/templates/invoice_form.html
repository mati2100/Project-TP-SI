<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="form-box">
    <h1>{{ title }}</h1>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                
                {% if field.help_text %}
                    <div class="form-help">
                        {{ field.help_text|safe }}
                    </div>
                {% endif %}

                {{ field }}

                {% if field.errors %}
                    <div class="form-errors">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit">Save</button>
            {% if request.GET.next %}
                <a href="{{ request.GET.next }}">Cancel</a>
            {% else %}
                <a href="{% url 'invoice_list' %}">Cancel</a>
            {% endif %}
        </div>
    </form>
</div>

</body>
</html>
