<!DOCTYPE html>
<html>
<head>
    <title>Delete Invoice</title>
</head>
<body>
    <h1>Delete Invoice</h1>
    
    <p>Are you sure you want to delete invoice: <strong>{{ invoice.invoice_number }} - {{ invoice.client.client_familyname }} {{ invoice.client.client_firstname }}</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'invoice_list' %}">Cancel</a>
    </form>
</body>
</html>
