{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Destination</title>
    <link rel="stylesheet" href="{% static 'css/confirm.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="confirm-box">
    <h1>Delete Destination</h1>

    <p class="confirm-message">
        Are you sure you want to delete this destination: 
        <strong>{{ destination.destination_city }}, {{ destination.destination_country }}</strong>?
    </p>

    <div class="confirm-details">
        <p><strong>Base Fare:</strong> ${{ destination.destination_base_fare }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="confirm-actions">
            <button type="submit" class="confirm-delete">Yes, Delete</button>
            <a href="{% url 'destination_list' %}" class="confirm-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
